<!DOCTYPE html>
<html lang="tr">
<head>
<meta name="robots" content="noindex, follow">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uslu Sürücü Kursu</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-image: url('background.jpg');
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .button {
            background-color: #4CAF50; /* Yeşil arka plan */
            border: none;
            color: white; /* Yazı rengi */
            padding: 20px 40px; /* Buton içi boşluk */
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 20px; /* Yazı boyutu */
            margin: 10px;
            cursor: pointer;
            border-radius: 5px; /* Kenar yuvarlama */
            transition: background-color 0.3s;
        }
        .button:hover {
            background-color: #45a049; /* Hover etkisi */
        }
    </style>
</head>
<body>
    <a href="https://odeme.meb.gov.tr/" target="_blank" class="button">Buton 1</a>
    <a href="https://odeme.meb.gov.tr/" target="_blank" class="button">E-SINAV ÖDEME</a>
</body>
</html>
